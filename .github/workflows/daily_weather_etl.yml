name: Daily Weather ETL

on:
  schedule:
    # Runs daily at 11:10 UTC (~6:10 AM Toronto in winter)
    - cron: "10 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fingerprint workflow
        run: |
          echo "WORKFLOW_FINGERPRINT=2026-02-10-A"
          sed -n '1,200p' .github/workflows/daily_weather_etl.yml

      - name: Fingerprint workflow
        run: |
          echo "WORKFLOW_FINGERPRINT=DAILY_WEATHER_V2"
          grep -n "python" -n .github/workflows/daily_weather_etl.yml || true

      - name: Run pipeline
        run: |
          python etl/run_weather_pipeline.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw warehouse reports README.md
          git commit -m "Daily update (weather ETL)" || echo "No changes to commit"
          git push
